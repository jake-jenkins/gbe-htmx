            <div class="flex-1"></div>
            <form id="region-form" hx-target="this" hx-swap="none">
                <div class="text-end mt-3 md:mt-0">
                    <!-- Form controls the region state -->

                    <input type="hidden" name="region" id="region-input" value="GB">
                    <nav class="flex space-x-4 list-none text-xl items-center">
                        <button type="button" class="cursor-pointer"
                            onclick="document.getElementById('region-input').value='england'; htmx.trigger('#region-input', 'change')">England</button>
                        <button type="button" class="cursor-pointer"
                            onclick="document.getElementById('region-input').value='wales'; htmx.trigger('#region-input', 'change')">Wales</button>
                        <button type="button" class="cursor-pointer"
                            onclick="document.getElementById('region-input').value='scotland'; htmx.trigger('#region-input', 'change')">Scotland</button>
                    </nav>

                </div>

        </header>

        <main class="flex-1 container mx-auto p-4 pt-8">

            <div>
                <div hx-get="/api/nations?format=html" hx-include="#region-form"
                    hx-trigger="load, change from:#region-input" hx-swap="innerHTML">
                </div>

                </form>
            </div>
            <!-- Elements include values from the form and listen to its change event -->
            <div hx-get="/api/live?format=html" hx-include="#region-form"
                hx-trigger="load, every 30s, change from:#region-input" hx-swap="innerHTML">
                <div class="htmx-indicator">Loading live energy data...</div>
            </div>

            <div hx-get="/api/history/24h?format=html" hx-include="#region-form"
                hx-trigger="load, every 30s, change from:#region-input" hx-swap="innerHTML">
                <div class="htmx-indicator">Loading daily energy data...</div>
            </div>

            <div hx-get="/api/daily?format=html" hx-include="#region-form"
                hx-trigger="load, every 30s, change from:#region-input" hx-swap="innerHTML">
                <div class="htmx-indicator">Loading monthly energy data...</div>
            </div>
        </main>

        <footer class="border-t-8 border-blue-700 dark:border-blue-300 container mx-auto">
            <div class="text-center py-8">GBenergy.live © 2026 Jake Jenkins</div>
        </footer>
